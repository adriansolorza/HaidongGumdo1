<script type="text/x-dc" data-dc-script data-props='{"senal":{"editor":"enum","options":["rojo","azul"],"default":"rojo"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const senal = this.props.senal ?? 'rojo';
const azul = senal === 'azul';
const flip = 'translate(1280 0) scale(-1 1)';
return {
saber: azul ? '#2f7bff' : '#ff3b3b',
figureTransform: azul ? flip : 'translate(0 0)',
arrowTransform: azul ? flip : 'translate(0 0)'
};
}
}
